# ── MySQL ────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://192.168.3.75:3306/openclaw
spring.datasource.username=goku
spring.datasource.password=${DB_PASSWORD}

# ── JPA/Hibernate ─────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Session ───────────────────────────────────────────────────────────────────
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# In production set to true when behind HTTPS
server.servlet.session.cookie.secure=false

# ── Remember-Me ───────────────────────────────────────────────────────────────
# Must match the key used in SecurityConfig. Set via env var.
app.remember-me-key=${REMEMBER_ME_KEY}

# ── OAuth2 Google ─────────────────────────────────────────────────────────────
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
# Redirect URI is always handled by THIS backend.
# Local:  http://localhost:8080/login/oauth2/code/google
# Prod:   {PUBLIC_BACKEND_URL}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# ── App ───────────────────────────────────────────────────────────────────────
# URL of the Angular frontend — used for CORS and post-OAuth redirect
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
