<!-- Global Splash Screen (Intro Video) -->
<div class="splash-screen" *ngIf="showSplash" [class.fade-out]="isFadingOut" (click)="playManual()">
  <video #introRef
         src="assets/intro.mp4"
         autoplay
         muted
         playsinline
         (timeupdate)="onTimeUpdate($event)"
         (ended)="onSplashEnded()"
         class="intro-video">
  </video>
  <div class="play-hint" *ngIf="showPlayHint">TOCA PARA EMPEZAR</div>
  <button class="skip-btn" (click)="onSplashEnded()">SKIP INTRO</button>
</div>

<!-- Subscription Modal -->
<div class="modal-backdrop" *ngIf="showSubscribeModal" (click)="closeSubscribeModal()">
  <div class="subscribe-modal" (click)="$event.stopPropagation()">
    <img src="assets/logo.png" alt="SKY DRIFT" class="modal-logo">
    <h3>¡Únete a la Aventura!</h3>
    <p>Suscríbete a nuestro canal de YouTube para ver más perspectivas elevadas.</p>
    <div class="modal-actions">
      <button class="subscribe-btn" (click)="goToYoutube()">SUSCRIBIRME EN YOUTUBE</button>
      <button class="close-modal-btn" (click)="closeSubscribeModal()">Cerrar</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════ AUTH MODAL -->
<div class="modal-backdrop" *ngIf="activePanel === 'auth'" (click)="closePanel()">
  <div class="auth-modal" (click)="$event.stopPropagation()">
    <button class="modal-close-x" (click)="closePanel()">✕</button>

    <!-- Google OAuth button -->
    <button class="btn-google" (click)="goToGoogle()">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continuar con Google
    </button>

    <div class="auth-divider"><span>o</span></div>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button [class.active]="authTab === 'login'"    (click)="authTab = 'login'">Iniciar sesión</button>
      <button [class.active]="authTab === 'register'" (click)="authTab = 'register'">Registrarse</button>
    </div>

    <!-- Form -->
    <form (ngSubmit)="authTab === 'login' ? doLogin() : doRegister()" #authForm="ngForm">
      <ng-container *ngIf="authTab === 'register'">
        <input class="auth-input" type="text" placeholder="Nombre (opcional)"
               [(ngModel)]="authDisplayName" name="displayName" autocomplete="name">
      </ng-container>

      <input class="auth-input" type="email" placeholder="Email" required
             [(ngModel)]="authEmail" name="email" autocomplete="email">

      <input class="auth-input" type="password" placeholder="Contraseña" required
             [(ngModel)]="authPassword" name="password" autocomplete="current-password">

      <label class="remember-me">
        <input type="checkbox" [(ngModel)]="authRememberMe" name="rememberMe">
        Recordar sesión
      </label>

      <p class="auth-error" *ngIf="authError">{{ authError }}</p>

      <button class="btn-primary" type="submit" [disabled]="authLoading">
        {{ authLoading ? '…' : (authTab === 'login' ? 'Entrar' : 'Crear cuenta') }}
      </button>
    </form>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════ PROFILE EDIT MODAL -->
<div class="modal-backdrop" *ngIf="activePanel === 'profile-edit'" (click)="closePanel()">
  <div class="auth-modal" (click)="$event.stopPropagation()">
    <button class="modal-close-x" (click)="closePanel()">✕</button>
    <h3 class="modal-title">Editar perfil</h3>

    <form (ngSubmit)="doSaveProfile()">
      <label class="auth-label">Email (solo lectura)</label>
      <input class="auth-input" type="email" [value]="currentUser?.email ?? ''" readonly disabled>

      <label class="auth-label">Nombre visible *</label>
      <input class="auth-input" type="text" placeholder="Nombre" required
             [(ngModel)]="profileDisplayName" name="displayName">

      <ng-container *ngIf="currentUser?.provider === 'local'">
        <label class="auth-label">Nueva contraseña (opcional)</label>
        <input class="auth-input" type="password" placeholder="Dejar vacío para no cambiar"
               [(ngModel)]="profilePassword" name="password" autocomplete="new-password">
      </ng-container>

      <p class="auth-error" *ngIf="profileError">{{ profileError }}</p>

      <button class="btn-primary" type="submit" [disabled]="profileLoading">
        {{ profileLoading ? '…' : 'Guardar' }}
      </button>
    </form>
  </div>
</div>

<!-- ══════════════════════════════════════════════════ PROFILE MINI-MENU dropdown -->
<div class="profile-menu-backdrop" *ngIf="activePanel === 'profile-menu'" (click)="closePanel()"></div>
<div class="profile-menu" *ngIf="activePanel === 'profile-menu'">
  <button (click)="openProfileEdit()">✏️ Editar perfil</button>
  <button (click)="doLogout()">↩ Cerrar sesión</button>
</div>

<!-- ══════════════════════════════════════════════════ MENU DRAWER (next PR) -->
<div class="modal-backdrop" *ngIf="activePanel === 'menu-drawer'" (click)="closePanel()">
  <div class="coming-soon-toast" (click)="$event.stopPropagation()">
    <span>🚀 Próximamente</span>
    <button (click)="closePanel()">✕</button>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════════════════════ HEADER -->
<header class="app-header">
  <!-- Brand (left) — unchanged clickable area -->
  <div class="branding" (click)="openSubscribeModal()" style="cursor: pointer;">
    <img src="assets/logo.png" alt="SKY DRIFT" class="logo">
    <div class="brand-text">
      <span class="main-title">SKY DRIFT</span>
      <span class="sub-title">Elevated Perspectives</span>
    </div>
  </div>

  <!-- Auth zone (middle-right of brand) -->
  <div class="header-auth">
    <!-- NOT logged in -->
    <button class="auth-trigger" *ngIf="!currentUser" (click)="openAuthModal()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
      </svg>
      Loguéate
    </button>

    <!-- Logged in -->
    <button class="auth-trigger greeting" *ngIf="currentUser" (click)="openProfileMenu()">
      Bienvenido, <strong>{{ greetingName }}</strong>
    </button>
  </div>

  <!-- Hamburger menu (far right) -->
  <button class="menu-btn" (click)="openMenuDrawer()" aria-label="Menú">
    <span></span><span></span><span></span>
  </button>
</header>

<!-- Globe (full screen, always behind) -->
<main class="content-area">
  <app-globe-view></app-globe-view>
</main>

<router-outlet />
